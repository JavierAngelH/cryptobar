name: CryptoBar
options:
  bundleIdPrefix: com.cryptobar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  CryptoBar:
    type: application
    platform: macOS
    sources:
      - path: CryptoBar
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryptobar.app
        PRODUCT_NAME: CryptoBar
        INFOPLIST_FILE: CryptoBar/Info.plist
        CODE_SIGN_ENTITLEMENTS: CryptoBar/CryptoBar.entitlements
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    entitlements:
      path: CryptoBar/CryptoBar.entitlements
